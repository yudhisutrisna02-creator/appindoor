<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5cf5" />
    <meta name="description" content="ERP terpadu: presensi geofencing, keuangan dual-entry, gudang, dan penjualan multi-channel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ERP System Indoor — Grha Indonesia Organik</title>
    <script>
      // Dijalankan sebelum React agar layar tidak sempat berkedip putih saat
      // aplikasi dibuka dalam tema gelap.
      (function () {
        try {
          var p = localStorage.getItem('erp-tema') || 'sistem';
          var gelap = p === 'gelap' ||
            (p === 'sistem' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (gelap) document.documentElement.classList.add('dark');
        } catch (e) { /* mode privat — biarkan tema terang */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
