name: Build & Deploy ke Hostinger

# Auto-deploy: setiap push ke branch utama akan diverifikasi build-nya,
# lalu memicu webhook deploy Hostinger.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Verifikasi Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Jangan memakai --ignore-scripts di sini: flag itu ikut membatalkan
      # penyiapan modul native, sehingga better-sqlite3 kehilangan berkas
      # binding-nya dan server gagal start. Cukup setel ERP_SKIP_CLIENT_BUILD
      # agar postinstall tetap jalan tetapi build frontend tidak dikerjakan
      # dua kali (ada langkah build tersendiri di bawah).
      - name: Install dependensi backend
        env:
          ERP_SKIP_CLIENT_BUILD: '1'
        run: npm install --no-audit --no-fund

      - name: Pastikan modul native siap
        run: node -e "require('better-sqlite3'); console.log('better-sqlite3 termuat')"

      - name: Install dependensi frontend
        run: npm --prefix client install --no-audit --no-fund

      - name: Build frontend
        run: npm --prefix client run build

      # Menjalankan server persis seperti Hostinger (NODE_ENV=production),
      # lalu menembak API sungguhan dengan uji asap end-to-end.
      - name: Uji boot server + uji asap
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: ci-secret-hanya-untuk-pengujian-build-1234567890
          DATABASE_URL: file:./data/ci.db
          SEED_ADMIN_EMAIL: ci@contoh.test
          SEED_ADMIN_PASSWORD: CiPassword123
          UPLOAD_DIR: ./uploads
        run: |
          set -o pipefail
          node server.js > server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              READY=1
              break
            fi
            # Bila proses sudah mati, tidak ada gunanya menunggu lagi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "::error::Server gagal merespons /api/health"
            echo "----- log server -----"
            cat server.log || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Server sehat:"
          curl -s http://localhost:3000/api/health
          echo ""

          if ! node scripts/smoke-test.js; then
            echo "::error::Uji asap gagal"
            echo "----- log server -----"
            cat server.log || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          if ! node scripts/smoke-features.js; then
            echo "::error::Uji fitur (mitra, kas, utang-piutang, retur, izin) gagal"
            echo "----- log server -----"
            cat server.log || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          kill $SERVER_PID 2>/dev/null || true

  deploy:
    name: Picu Webhook Hostinger
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      # Simpan URL webhook dari hPanel sebagai repository secret HOSTINGER_DEPLOY_WEBHOOK.
      # Bila secret belum diisi, langkah ini dilewati tanpa menggagalkan pipeline.
      - name: Kirim permintaan deploy
        env:
          WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Secret HOSTINGER_DEPLOY_WEBHOOK belum diatur — melewati langkah deploy."
            echo "Hostinger tetap dapat menarik perubahan sendiri bila Auto-Deploy aktif di hPanel."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK")
          echo "Webhook merespons HTTP $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "Deploy gagal dipicu."
            exit 1
          fi
